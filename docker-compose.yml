services:
  postgres:
    image: postgres:16-alpine
    container_name: josh-postgres
    environment:
      POSTGRES_USER: josh
      POSTGRES_PASSWORD: josh_dev_password
      POSTGRES_DB: josh
      TZ: Asia/Calcutta
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./server/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U josh -d josh"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: josh-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@absstem.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: Asia/Calcutta
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker-data/pgadmin:/var/lib/pgadmin

