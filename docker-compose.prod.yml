services:
  postgres:
    image: postgres:16-alpine
    container_name: josh-postgres
    environment:
      POSTGRES_USER: josh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_env}
      POSTGRES_DB: josh
      TZ: Asia/Calcutta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./server/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U josh -d josh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: josh-api
    env_file:
      - ./server/.env
    volumes:
      - ./server/storage:/app/server/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: josh-frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: josh-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
